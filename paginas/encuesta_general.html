<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta General</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background-color:#f2f2f2;
            font-family:Arial, sans-serif;
            font-size:18px;
        }

        header{
            background-color:#0d6efd;
            color:white;
            text-align:center;
            padding:20px;
        }

        .card{
            margin-top:20px;
        }

        footer{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }

    </style>

</head>

<body>

<header>

    <h1>Encuesta General</h1>

    <p>Su opinión nos ayuda a mejorar.</p>

</header>

<main class="container">

    <section>

        <div class="card">

            <div class="card-body">

                <form onsubmit="enviarEncuesta(event)">

                    <div class="mb-4">

                        <label class="form-label">
                            1. ¿Cómo fue la atención recibida?
                        </label>

                        <select class="form-select" required>

                            <option value="">Seleccione una opción</option>
                            <option>Excelente</option>
                            <option>Muy buena</option>
                            <option>Buena</option>
                            <option>Regular</option>
                            <option>Mala</option>

                        </select>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            2. ¿Encontró fácilmente la información?
                        </label>

                        <select class="form-select" required>

                            <option value="">Seleccione una opción</option>
                            <option>Sí</option>
                            <option>No</option>

                        </select>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            3. ¿Desea dejar un comentario?
                        </label>

                        <textarea class="form-control" rows="4" placeholder="Escriba aquí..."></textarea>

                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100">
                        Enviar encuesta
                    </button>

                </form>

            </div>

        </div>

        <a href="../index.html" class="btn btn-secondary w-100 mt-3">
            Volver al inicio
        </a>

    </section>

</main>

<footer>

    Hospital de Clínicas - S.I.G.S.M.  © 2026

</footer>

<script>

function enviarEncuesta(event){

    event.preventDefault();

    alert("¡Muchas gracias! Su encuesta fue enviada correctamente.");

    window.location.href = "index.html";

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
